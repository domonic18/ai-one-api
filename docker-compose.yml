services:
  one-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: one-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data/oneapi:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=oneapi:123456@tcp(db:3306)/oneapi  # 修改此行，或注释掉以使用 SQLite 作为数据库
      - REDIS_CONN_STRING=redis://redis
      - SESSION_SECRET=random_string  # 修改为随机字符串
      - TZ=Asia/Shanghai
#      - NODE_TYPE=slave  # 多机部署时从节点取消注释该行
#      - FRONTEND_BASE_URL=https://openai.justsong.cn  # 多机部署时从节点取消注释该行
      - SYNC_FREQUENCY=60  # 需要定期从数据库加载数据时取消注释该行
      - COURSEWARE_ENABLED=true                                    # 启用课件平台集成
      - COURSEWARE_PLATFORM_BASE_URL=http://192.168.6.118:8080   # 课件平台API地址
      - COURSEWARE_PLATFORM_API_KEY=mock_api_key_123              # 课件平台API密钥
      - COURSEWARE_PLATFORM_TIMEOUT=5                              # API超时时间（秒）
      - COURSEWARE_CACHE_TTL=10m                                   # 缓存时间（可选）
      - COURSEWARE_REFRESH_INTERVAL=1h                             # 刷新间隔（可选）
      - COURSEWARE_PRELOAD_BATCH_SIZE=100                          # 预加载批次大小（可选）
      - COURSEWARE_DEFAULT_GROUP=default                           # 默认用户组（可选）
    depends_on:
      - redis
      - db
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' | awk -F: '{print $2}'" ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: "${REGISTRY:-docker.io}/redis:latest"
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  db:
    image: "${REGISTRY:-docker.io}/mysql:8.2.0"
    restart: always
    container_name: mysql
    volumes:
      - ./data/mysql:/var/lib/mysql  # 挂载目录，持久化存储
    ports:
      - '3306:3306'
    environment:
      TZ: Asia/Shanghai   # 设置时区
      MYSQL_ROOT_PASSWORD: 'OneAPI@justsong' # 设置 root 用户的密码
      MYSQL_USER: oneapi   # 创建专用用户
      MYSQL_PASSWORD: '123456'    # 设置专用用户密码
      MYSQL_DATABASE: oneapi   # 自动创建数据库